services:
  db:
    image: mysql:8.4
    container_name: club_deportivo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-club_deportivo}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea tablas y seeds corriendo python init_db.py (charset utf8mb4 correcto).
  # Arranca solo cuando db está healthy y termina al seedear.
  init_db:
    image: python:3.12-slim
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-club_deportivo}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      DB_SCHEMA_PATH: database/init_db.sql
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install --quiet -r requirements.txt &&
             python init_db.py"
    restart: "no"

volumes:
  mysql_data: