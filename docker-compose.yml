services:
  db:
    image: mysql:8.4
    container_name: club_deportivo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-club_deportivo}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # El entrypoint de MySQL corre database/initdb.sh la primera vez que se crea
      # el volumen. El script ejecuta los .sql con --default-character-set=utf8mb4
      # para no romper los acentos. Sin pip install ni problemas de timing.
      - ./database/init_db.sql:/sql/01-init_db.sql:ro
      - ./database/seed.sql:/sql/02-seed.sql:ro
      - ./database/initdb.sh:/docker-entrypoint-initdb.d/00-initdb.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s

volumes:
  mysql_data: